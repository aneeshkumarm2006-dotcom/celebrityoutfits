# Local Postgres for development only.
# Production uses Supabase — swap DATABASE_URI in .env when you have it.
services:
  postgres:
    image: postgres:16-alpine
    container_name: spotted-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spotted
      POSTGRES_PASSWORD: spotted
      POSTGRES_DB: spotted
    ports:
      - '5432:5432'
    volumes:
      - spotted-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spotted -d spotted']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spotted-pgdata:
